<!-- Task Review Modal: displays image on the left, editing fields on the right, and actions -->
<div id="task-review-modal" class="modal-backdrop" onclick="closeTaskReviewModal(event)">
  <div class="modal-container review-modal-wide">
    <div class="modal-header">
      <h3 class="modal-title">Review Task Candidate</h3>
      <button class="modal-close-btn" onclick="closeTaskReviewModal(event, true)">&times;</button>
    </div>

    <!-- Mobile Tab Switcher: Separate tab for image preview vs task details -->
    <div class="review-modal-tabs" id="review-modal-tabs" role="tablist" aria-label="Candidate review navigation">
      <button type="button" class="review-tab-btn active" id="review-tab-btn-form" role="tab" aria-selected="true" onclick="switchReviewTab('form')">
        <span class="review-tab-icon">📝</span>
        <span class="review-tab-title">Task Details</span>
      </button>
      <button type="button" class="review-tab-btn" id="review-tab-btn-image" role="tab" aria-selected="false" onclick="switchReviewTab('image')">
        <span class="review-tab-icon">🖼️</span>
        <span class="review-tab-title">Image Preview</span>
      </button>
    </div>

    <div class="modal-body review-split-layout" id="review-split-layout" data-active-tab="form">
      <!-- Left side: Screenshot Image Preview -->
      <div class="review-image-pane" id="review-image-pane">
        <div class="image-zoom-container">
          <img id="review-screenshot-img" src="" alt="Source Screenshot">
        </div>
        <div class="image-actions">
          <a id="review-screenshot-link" href="" target="_blank" class="btn btn-outline btn-sm">🔍 Open Original Image</a>
        </div>
      </div>

      <!-- Right side: Edit fields -->
      <div class="review-form-pane" id="review-form-pane">
        <form id="task-review-form" onsubmit="saveTaskReviewForm(event)">
          <input type="hidden" id="review-candidate-id">

          <div class="form-group">
            <label for="review-title">Task Title</label>
            <input type="text" id="review-title" class="text-input font-semibold" placeholder="Task summary name"
              required>
          </div>

          <div class="form-grid-3" style="margin-bottom:16px;">
            <div class="form-group">
              <label for="review-priority">Priority</label>
              <select id="review-priority" class="select-input">
                <option value="LOW">LOW</option>
                <option value="MEDIUM">MEDIUM</option>
                <option value="HIGH">HIGH</option>
              </select>
            </div>
            <div class="form-group">
              <label for="review-start-date">Start Date</label>
              <input type="date" id="review-start-date" class="text-input">
            </div>
            <div class="form-group">
              <label for="review-deadline">Due Date</label>
              <input type="date" id="review-deadline" class="text-input">
            </div>
          </div>

          <div class="form-group">
            <label for="review-summary">Description</label>
            <textarea id="review-summary" class="textarea-input" placeholder="Task requirements summary detail..."
              rows="4"></textarea>
          </div>

          <div class="form-group">
            <label for="review-source-url">Link</label>
            <input type="text" id="review-source-url" class="text-input" placeholder="https://example.com/source">
          </div>

          <div class="divider" style="margin:20px 0; border-top:1px solid rgba(255,255,255,0.06);"></div>

          <div class="form-actions review-form-actions">
            <div class="review-actions-group-left">
              <button type="button" class="btn btn-outline btn-danger btn-sm" onclick="deleteCandidateReview()">🗑️
                Delete</button>
              <button type="button" id="review-btn-ignore" class="btn btn-outline btn-sm"
                onclick="ignoreCandidateReview()">🚫 Ignore</button>
              <button type="button" id="review-btn-reanalyze" class="btn btn-outline btn-sm"
                onclick="reanalyzeCandidateReview()">🤖 Reprocess</button>
            </div>
            <div class="review-actions-group-right">
              <button type="submit" class="btn btn-primary btn-sm">💾 Save</button>
              <button type="button" id="review-btn-sync" class="btn btn-success btn-sm"
                onclick="syncCandidateReview()">🚀 Push to Notion</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
